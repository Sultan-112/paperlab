name: Verify reference implementation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.lock && pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/validate_infrastructure.py
      - run: python scripts/init_env.py && docker compose config --quiet
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: '11.19.0'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/init_env.py
      - run: docker compose build
      - run: docker compose up -d postgres redis api web
      - name: Wait for actual stack readiness
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"; then break; fi
            sleep 2
          done
          docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
          curl --fail http://localhost:8080
      - if: always()
        run: docker compose logs --no-color && docker compose down
