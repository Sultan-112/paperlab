# Merge these jobs into Majed's existing Prometheus config; do not replace it.
scrape_configs:
  # When Prometheus or its collector runs on the demo VM host:
  - job_name: paperlab-demo
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9180"]

  # Optional external probe, if Majed's stack already has Blackbox Exporter.
  # Replace the domain and exporter address before enabling this job.
  - job_name: paperlab-public
    scrape_interval: 30s
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: ["https://demo.example.invalid/monitor/ready"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
