name: Verify reference implementation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.lock && pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/validate_infrastructure.py
      - run: python scripts/init_env.py && docker compose config --quiet
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: '11.19.0'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm build
  containers:
    runs-on: ubuntu-latest
    env:
      PUBLIC_DOMAIN: demo.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/init_env.py
      - run: docker compose -f docker-compose.yml -f docker-compose.public.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.public.yml build api web
      - run: docker compose -f docker-compose.yml -f docker-compose.public.yml up -d postgres redis api web
      - name: Wait for public demo readiness and verify guest boundary
        run: |
          for i in $(seq 1 60); do
            if docker compose -f docker-compose.yml -f docker-compose.public.yml exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"; then break; fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.public.yml exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
          curl --fail --silent http://localhost:8080/ > /dev/null
          curl --fail --silent http://localhost:8080/api/state | python -c 'import json,sys; state=json.load(sys.stdin); assert state["demo_read_only"] is True; assert state["wallets"] == state["positions"] == state["trades"] == []'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://localhost:8080/api/catalog/US/refresh)
          test "$status" = 401
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.public.yml logs --no-color && docker compose -f docker-compose.yml -f docker-compose.public.yml down
