name: paperlab
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperlab
      POSTGRES_DB: paperlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U paperlab -d paperlab']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    image: paperlab-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://paperlab:${POSTGRES_PASSWORD}@postgres:5432/paperlab
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      DATA_MODE: ${DATA_MODE:-live}
      STOCK_POLL_SECONDS: ${STOCK_POLL_SECONDS:-15}
      SAUDI_POLL_SECONDS: ${SAUDI_POLL_SECONDS:-60}
      APP_TOKEN: ${APP_TOKEN:?Run scripts/init_env.py first}
      PUBLIC_DEMO: ${PUBLIC_DEMO:-false}
      PUBLIC_LIVE_DATA_ALLOWED: ${PUBLIC_LIVE_DATA_ALLOWED:-false}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      US_STREAM_LIMIT: ${US_STREAM_LIMIT:-30}
      REPLAY_FILE: ${REPLAY_FILE:-data/replay/demo.csv}
      KSA_CATALOG_FILE: ${KSA_CATALOG_FILE:-data/imports/ksa.csv}
    volumes: [./data/imports:/app/data/imports:ro]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  web:
    image: paperlab-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['127.0.0.1:8080:8080']
    depends_on: [api]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  ollama:
    image: ollama/ollama:0.11.10
    volumes: [ollama-data:/root/.ollama]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:9090:9090']
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run scripts/init_env.py first}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ['127.0.0.1:3000:3000']
    restart: unless-stopped
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    profiles: [linux-observability]
    privileged: true
    volumes: ['/:/rootfs:ro', '/var/run:/var/run:ro', '/sys:/sys:ro', '/var/lib/docker:/var/lib/docker:ro', '/dev/disk:/dev/disk:ro']
    devices: [/dev/kmsg]
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  ollama-data:
  prometheus-data:
  grafana-data:
