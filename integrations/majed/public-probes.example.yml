# Optional: merge this job only after replacing the domain and exporter address.
# Run Blackbox Exporter OUTSIDE the PaperLab VM to detect VM and network outages.
scrape_configs:
  - job_name: paperlab-public
    scrape_interval: 15s
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets:
          - https://demo.example.invalid/
          - https://demo.example.invalid/monitor/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
